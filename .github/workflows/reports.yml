name: Retirement reports

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday 12:17 UTC: 08:17 EDT / 07:17 EST. GitHub schedules can be delayed.
    - cron: '17 12 * * 1'
  workflow_dispatch:
    inputs:
      date:
        description: 'Edition date (YYYY-MM-DD); blank uses America/New_York today'
        required: false
        type: string
      revision:
        description: '1 for a new edition; next sequential number for a correction'
        default: '1'
        type: string
      reason:
        description: 'Public explanation for this edition or correction'
        default: 'Weekly public-source refresh; deadline changes require review'
        type: string

permissions:
  contents: read

concurrency:
  group: retirement-reports-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm test && npm run validate && npm run verify
      - name: Reject modification or deletion of past editions
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node src/check-history.mjs

  report:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Collect public sources and create a new immutable edition
        env:
          EDITION_DATE: ${{ inputs.date }}
          EDITION_REVISION: ${{ inputs.revision || '1' }}
          EDITION_REASON: ${{ inputs.reason || 'Weekly public-source refresh; deadline changes require review' }}
        run: |
          args=(--revision "$EDITION_REVISION" --reason "$EDITION_REASON")
          if [ -n "$EDITION_DATE" ]; then args+=(--date "$EDITION_DATE"); fi
          node src/cli.mjs report "${args[@]}"
          npm run verify
      - name: Persist only the new public report edition
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- reports index.html latest.json
          git diff --cached --quiet && { echo "No new edition was created"; exit 1; }
          git commit -m "Archive weekly public retirement report" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:main
      - name: Downloadable report archive (convenience copy, not canonical storage)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: retirement-report-archive-${{ github.run_id }}
          path: |
            index.html
            latest.json
            reports/
          retention-days: 90
          if-no-files-found: error
      - name: Summarize freshness and coverage
        run: node src/run-summary.mjs
